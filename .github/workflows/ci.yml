name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generation validates the URL format but does not connect during CI checks.
      DATABASE_URL: postgresql://solid_ci:solid_ci@127.0.0.1:5432/solid_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      # Fresh runners need generated database types and shared runtime exports.
      - run: npm run build --workspace=@solid/contracts --workspace=@solid/config --workspace=@solid/authorization --workspace=@solid/database
      - run: npm run check
      - run: npm run audit:prod
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: solid_ci
          POSTGRES_PASSWORD: solid_ci
          POSTGRES_DB: solid_ci_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solid_ci -d solid_ci_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://solid_ci:solid_ci@127.0.0.1:5432/solid_ci_test
      TEST_DATABASE_URL: postgresql://solid_ci:solid_ci@127.0.0.1:5432/solid_ci_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22.12.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=@solid/contracts --workspace=@solid/config --workspace=@solid/authorization --workspace=@solid/database
      - run: npm run db:deploy
      - run: npm run test:integration
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VISUAL_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22.12.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npx playwright test --config scripts/analytics-ui.config.mjs
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install semgrep==1.177.0
      - run: semgrep scan --config p/security-audit --config p/owasp-top-ten --metrics off --error --severity ERROR apps/api/src apps/web/src apps/worker/src packages/config/src packages/authorization/src
  web-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22.12.0 }
      - run: docker build -f Dockerfile.web -t solid-web-check .
      - run: docker run -d --name solid-web-check -p 127.0.0.1:8080:80 solid-web-check
      - run: node scripts/check-web-headers.mjs http://127.0.0.1:8080
