map $uri $solid_cache_control {
  default "";
  "/" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  "/index.html" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  "/site.html" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  "/sw.js" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  ~^/assets/ "public, max-age=31536000, immutable";
}

map $host $solid_home_document {
  default /index.html;
  solidcheckout.xyz /site.html;
  www.solidcheckout.xyz /site.html;
}

map $uri $solid_pragma {
  default "";
  "/index.html" "no-cache";
  "/site.html" "no-cache";
  "/sw.js" "no-cache";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://connect.facebook.net https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; frame-src https://challenges.cloudflare.com https://www.googletagmanager.com https://www.youtube-nocookie.com https://player.vimeo.com; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://connect.facebook.net https://www.facebook.com https://api.solidcheckout.xyz https://challenges.cloudflare.com https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://ad.doubleclick.net https://www.google.com https://google.com https://www.google.com.br https://stats.g.doubleclick.net; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Cache-Control $solid_cache_control always;
  add_header Pragma $solid_pragma always;

  location = /index.html {
    expires off;
    try_files $uri =404;
  }

  location = / {
    try_files $solid_home_document =404;
  }

  location = /site.html {
    expires off;
    try_files $uri =404;
  }

  location = /sw.js {
    expires off;
    try_files $uri =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
    expires 1h;
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
